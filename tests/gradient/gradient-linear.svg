<?xml version="1.0" encoding="UTF-8"?>
<!--
  Linear gradient exercising stop offsets (fractional, percent and
  out-of-range), an explicit spreadMethod and gradient coordinates.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="-20%" stop-color="#ff0000"/>
      <stop offset="0.4"   stop-color="#00ff00"/>
      <stop offset="150%"  stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="100" fill="url(#lg)"/>
</svg>
