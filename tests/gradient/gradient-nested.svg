<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gradient inheritance through xlink:href. 'child' has no stops or geometry of
  its own and must inherit everything from 'base'; 'override' redefines only
  spreadMethod while still inheriting coordinates and the stop list. Also
  covers the SVG2 'href' form (no xlink prefix).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="100" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1" spreadMethod="reflect">
      <stop offset="0"   stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#00ff00"/>
      <stop offset="1"   stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="child" xlink:href="#base"/>
    <linearGradient id="override" xlink:href="#base" spreadMethod="repeat"/>
    <linearGradient id="svg2child" href="#base"/>
  </defs>
  <rect x="0"   y="0" width="100" height="100" fill="url(#child)"/>
  <rect x="100" y="0" width="100" height="100" fill="url(#override)"/>
  <rect x="200" y="0" width="100" height="100" fill="url(#svg2child)"/>
</svg>
