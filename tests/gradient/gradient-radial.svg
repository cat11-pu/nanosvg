<?xml version="1.0" encoding="UTF-8"?>
<!--
  Radial gradient with a focal point, repeat spread and fractional offsets.
  The second case omits fx/fy to verify the focal defaults to the center.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.25" spreadMethod="repeat">
      <stop offset="0.1" stop-color="#ffffff"/>
      <stop offset="0.9" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="rgDefault">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="1"   stop-color="#000000"/>
    </radialGradient>
  </defs>
  <circle cx="50"  cy="50" r="45" fill="url(#rg)"/>
  <circle cx="150" cy="50" r="45" fill="url(#rgDefault)"/>
</svg>
